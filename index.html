<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wheel of Life · วงล้อชีวิต</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f7f79">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="วงล้อชีวิต">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#23303a; --muted:#6b7780; --line:#e4e0d6;
  --accent:#2f7f79; --accent-ink:#ffffff; --accent-soft:#dff0ee; --warn:#c2603b; --good:#3b8a5a;
  --grid:#d9d5c9; --shadow:0 1px 2px rgba(35,48,58,.06),0 6px 20px rgba(35,48,58,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14191d; --card:#1d242a; --ink:#e8ecee; --muted:#92a0a9; --line:#2b353d;
    --accent:#5bb8b0; --accent-ink:#0f1a19; --accent-soft:#1f3836; --warn:#e08a63; --good:#6cc28c;
    --grid:#34414a; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#14191d; --card:#1d242a; --ink:#e8ecee; --muted:#92a0a9; --line:#2b353d;
  --accent:#5bb8b0; --accent-ink:#0f1a19; --accent-soft:#1f3836; --warn:#e08a63; --good:#6cc28c;
  --grid:#34414a; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans Thai",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 110px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px}
.brand h1{font-size:1.2rem;margin:0;line-height:1.2}
.brand small{color:var(--muted);display:block;font-size:.8rem;font-weight:400}
.tools{display:flex;gap:8px}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;transition:background .15s,border-color .15s}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:transparent}
.btn-sm{padding:4px 10px;font-size:.85rem}
nav.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:20px;box-shadow:var(--shadow);overflow-x:auto}
nav.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 12px;white-space:nowrap;color:var(--muted);font-weight:500}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:1.1rem}
.card .sub{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.1fr .9fr}
@media(max-width:820px){.g2{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.stat .v{font-size:1.9rem;font-weight:700;line-height:1.1}
.stat .l{color:var(--muted);font-size:.82rem}
.delta{font-size:.82rem;font-weight:600;margin-left:6px}
.up{color:var(--good)} .down{color:var(--warn)} .flat{color:var(--muted)}
@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}
.radar-box{display:flex;justify-content:center}
.radar-box svg{width:100%;max-width:470px;height:auto}
.legend{display:flex;gap:14px;justify-content:center;color:var(--muted);font-size:.85rem;margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.rows{display:flex;flex-direction:column;gap:11px}
.arow .top{display:flex;justify-content:space-between;align-items:baseline;font-size:.93rem}
.bar{height:9px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:4px}
.bar>span{display:block;height:100%;border-radius:6px;transition:width .5s}
.insight{background:var(--accent-soft);border-radius:14px;padding:14px 16px;margin-top:16px;font-size:.93rem}
.insight b{display:block;margin-bottom:2px}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.empty .big{font-size:2.4rem}
label.f{display:block;font-weight:600;font-size:.92rem;margin:14px 0 6px}
input[type=text],input[type=date],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
textarea{min-height:76px;resize:vertical}
.slider-row{padding:12px 0;border-top:1px solid var(--line)}
.slider-row:first-of-type{border-top:0}
.slider-row .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.slider-row .n{font-weight:600}
.slider-row .hint{color:var(--muted);font-size:.82rem}
.slider-row .val{font-size:1.2rem;font-weight:700;min-width:2ch;text-align:right}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--accent);height:28px}
.mood{display:flex;gap:8px;flex-wrap:wrap}
.mood button{font-size:1.5rem;padding:6px 12px;line-height:1.2}
.mood button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;font-size:.85rem;border-radius:999px}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip[aria-pressed="false"]{opacity:.45}
.chart svg{width:100%;height:auto;display:block}
.hist{display:flex;flex-direction:column;gap:10px}
.hitem{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.hitem .d{font-weight:600}
.hitem .m{color:var(--muted);font-size:.88rem;white-space:pre-wrap}
.pill{display:inline-block;background:var(--accent-soft);border-radius:999px;padding:1px 10px;font-size:.78rem;margin-right:4px}
.goal{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.goal input{width:20px;height:20px;accent-color:var(--accent)}
.goal.done span{text-decoration:line-through;color:var(--muted)}
.goal span{flex:1}
.addgoal{display:grid;grid-template-columns:180px 1fr auto;gap:8px}
@media(max-width:620px){.addgoal{grid-template-columns:1fr}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:620px){.row2{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:28px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="var(--accent)" stroke-width="2.5"/><g stroke="var(--accent)" stroke-width="2"><path d="M20 2v36M2 20h36M7.3 7.3l25.4 25.4M32.7 7.3L7.3 32.7"/></g><circle cx="20" cy="20" r="5" fill="var(--accent)"/></svg>
      <h1>วงล้อชีวิต<small>Wheel of Life &amp; Reflection</small></h1>
    </div>
    <div class="tools">
      <button id="themeBtn" class="btn-sm" aria-label="สลับธีมสว่าง/มืด" title="สลับธีม">◐</button>
      <button id="dataBtn" class="btn-sm">ข้อมูล</button>
    </div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
  <footer>ข้อมูลทั้งหมดเก็บในเครื่องของคุณ (localStorage) · ไม่มีการส่งออกไปที่ใด</footer>
</div>
<div class="toast" id="toast" role="status"></div>
<dialog id="dlg" style="border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);max-width:420px;width:calc(100% - 32px)">
  <h2 style="margin-top:0">จัดการข้อมูล</h2>
  <div style="display:flex;flex-direction:column;gap:10px">
    <button id="exportBtn">⬇ ส่งออกสำรองข้อมูล (JSON)</button>
    <button id="importBtn">⬆ นำเข้าข้อมูลสำรอง</button>
    <button id="demoBtn">✨ โหลดข้อมูลตัวอย่าง (แทนที่ข้อมูลเดิม)</button>
    <button id="clearBtn" style="color:var(--warn)">🗑 ลบข้อมูลทั้งหมด</button>
    <button id="closeDlg" class="btn-ghost">ปิด</button>
  </div>
  <input type="file" id="file" accept="application/json" hidden>
</dialog>

<script>
"use strict";
/* ---------- config ---------- */
const AREAS = [
  {key:"body",   name:"สุขภาพกาย",       icon:"💪", color:"#3b8a5a", hint:"พลังงาน การนอน อาหาร การออกกำลังกาย"},
  {key:"mind",   name:"สุขภาพใจ",        icon:"🧘", color:"#7c6bc4", hint:"ความสงบ จัดการความเครียด อารมณ์มั่นคง"},
  {key:"career", name:"การงาน",          icon:"💼", color:"#2f7fb8", hint:"ความหมาย ความก้าวหน้า ความพอใจในงาน"},
  {key:"money",  name:"การเงิน",         icon:"💰", color:"#c9962b", hint:"รายได้ ออม หนี้ ความมั่นคงทางการเงิน"},
  {key:"family", name:"ครอบครัว",        icon:"🏡", color:"#d2646e", hint:"เวลาคุณภาพ ความอบอุ่น ความเข้าใจ"},
  {key:"social", name:"เพื่อนและสังคม",  icon:"🤝", color:"#d97b3a", hint:"มิตรภาพ ชุมชน การได้รับการสนับสนุน"},
  {key:"growth", name:"การเรียนรู้",     icon:"📚", color:"#2aa198", hint:"ทักษะใหม่ มุมมองใหม่ การเติบโต"},
  {key:"joy",    name:"ความสุข/พักผ่อน", icon:"🎨", color:"#b5559c", hint:"งานอดิเรก เล่น พัก ความสนุก"}
];
const MOODS = ["😞","😕","😐","🙂","😄"];
const PROMPTS = [
  ["grat","🙏 สัปดาห์นี้ฉันรู้สึกขอบคุณเรื่องอะไรบ้าง?"],
  ["win","🌱 ชัยชนะเล็กๆ ที่ฉันภูมิใจคืออะไร?"],
  ["hard","🌧 อะไรที่ทำให้ฉันติดขัดหรือเหนื่อยล้า?"],
  ["learn","💡 ฉันได้เรียนรู้อะไรเกี่ยวกับตัวเอง?"],
  ["next","🎯 สัปดาห์หน้าฉันจะดูแลเรื่องอะไรเป็นพิเศษ?"]
];
const KEY = "wheel-of-life.v1";
const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today = ()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fmtDate = (iso,long)=>new Date(iso+"T00:00:00").toLocaleDateString("th-TH",long?{day:"numeric",month:"long",year:"numeric"}:{day:"numeric",month:"short"});
const avg = a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const r1 = n=>Math.round(n*10)/10;
const area = k=>AREAS.find(a=>a.key===k);

/* ---------- state ---------- */
let S = load();
function load(){
  try{ const d=JSON.parse(localStorage.getItem(KEY)); if(d&&Array.isArray(d.checkins)) return {checkins:d.checkins,reflections:d.reflections||[],goals:d.goals||[]}; }catch(e){}
  return {checkins:[],reflections:[],goals:[]};
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast("บันทึกลงเครื่องไม่ได้ (พื้นที่เต็มหรือถูกบล็อก)");} }
const sorted = ()=>[...S.checkins].sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));
const overall = c=>r1(avg(AREAS.map(a=>c.scores[a.key]||0)));
function balance(c){ // 0-100, higher = more even
  const v=AREAS.map(a=>c.scores[a.key]||0), m=avg(v);
  const sd=Math.sqrt(avg(v.map(x=>(x-m)**2)));
  return Math.max(0,Math.round(100*(1-sd/3.5)));
}

/* ---------- ui helpers ---------- */
let tab="home", ui={sel:new Set(AREAS.map(a=>a.key)), draft:null, mood:3};
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),2400);}
function deltaHtml(d){ if(d===null) return ""; const c=d>0.05?"up":d<-0.05?"down":"flat"; const s=d>0.05?"▲ +":d<-0.05?"▼ ":"– "; return `<span class="delta ${c}">${s}${Math.abs(r1(d))}</span>`; }

/* ---------- charts ---------- */
function radar(series){
  const W=470, cx=W/2, cy=W/2, R=150, n=AREAS.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n, r=R*v/10; return [cx+r*Math.cos(a), cy+r*Math.sin(a)];};
  let g="";
  for(let l=2;l<=10;l+=2){ g+=`<polygon points="${AREAS.map((_,i)=>pt(i,l).join(",")).join(" ")}" fill="none" stroke="var(--grid)" stroke-width="1"/>`; g+=`<text x="${cx+3}" y="${cy-R*l/10-2}" font-size="9" fill="var(--muted)">${l}</text>`; }
  AREAS.forEach((a,i)=>{ const [x,y]=pt(i,10); g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--grid)"/>`; });
  series.forEach(s=>{
    const pts=AREAS.map((a,i)=>pt(i,s.scores[a.key]||0));
    g+=`<polygon points="${pts.map(p=>p.join(",")).join(" ")}" fill="${s.fill||"none"}" stroke="${s.stroke}" stroke-width="${s.dash?1.8:2.6}" ${s.dash?'stroke-dasharray="5 4"':""} stroke-linejoin="round"/>`;
    if(!s.dash) pts.forEach((p,i)=>{g+=`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${AREAS[i].color}" stroke="var(--card)" stroke-width="2"><title>${AREAS[i].name}: ${s.scores[AREAS[i].key]}</title></circle>`;});
  });
  AREAS.forEach((a,i)=>{
    const ang=-Math.PI/2+i*2*Math.PI/n, x=cx+(R+30)*Math.cos(ang), y=cy+(R+30)*Math.sin(ang);
    const anchor=Math.abs(Math.cos(ang))<.2?"middle":Math.cos(ang)>0?"start":"end";
    g+=`<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="12.5" font-weight="600" fill="var(--ink)">${a.icon} ${esc(a.name)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${W}" role="img" aria-label="กราฟวงล้อชีวิต 8 ด้าน">${g}</svg>`;
}

function lineChart(list){
  const W=720,H=330,L=36,Rr=16,T=16,B=44, iw=W-L-Rr, ih=H-T-B, n=list.length;
  const x=i=>L+(n===1?iw/2:iw*i/(n-1)), y=v=>T+ih*(1-v/10);
  let g="";
  for(let v=0;v<=10;v+=2){ g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-dasharray="${v?"3 4":""}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`; }
  const step=Math.ceil(n/7);
  list.forEach((c,i)=>{ if(i%step===0||i===n-1) g+=`<text x="${x(i)}" y="${H-18}" text-anchor="middle" font-size="11" fill="var(--muted)">${fmtDate(c.date)}</text>`; });
  const line=(vals,color,w,dash)=>{
    const d=vals.map((v,i)=>`${i?"L":"M"}${x(i)},${y(v)}`).join(" ");
    return `<path d="${d}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" ${dash?'stroke-dasharray="6 5"':""}/>`+
      vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${w>2.5?4.5:3.5}" fill="${color}" stroke="var(--card)" stroke-width="1.5"><title>${fmtDate(list[i].date)}: ${r1(v)}</title></circle>`).join("");
  };
  AREAS.filter(a=>ui.sel.has(a.key)).forEach(a=>{ g+=line(list.map(c=>c.scores[a.key]||0),a.color,2); });
  g+=line(list.map(overall),"var(--ink)",3.2,true);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟความก้าวหน้าตามเวลา">${g}</svg>`;
}

/* ---------- views ---------- */
function viewHome(){
  const L=sorted();
  if(!L.length) return `<div class="card empty"><div class="big">🌿</div><h2>เริ่มต้นวัดผลชีวิตของคุณ</h2>
    <p>ให้คะแนน 8 ด้านของชีวิตตามความรู้สึกจริง เพื่อดูว่าชีวิตสมดุลแค่ไหน และด้านไหนอยากดูแลเพิ่ม</p>
    <button class="btn-primary" data-go="check">ทำการเช็คอินครั้งแรก</button>
    <p style="margin-top:12px"><button class="btn-sm btn-ghost" id="demoInline">หรือดูตัวอย่างด้วยข้อมูลสาธิต</button></p></div>`;
  const cur=L[L.length-1], prev=L[L.length-2]||null;
  const o=overall(cur), od=prev?o-overall(prev):null, b=balance(cur), bd=prev?b-balance(prev):null;
  const sortedAreas=[...AREAS].sort((p,q)=>cur.scores[p.key]-cur.scores[q.key]);
  const low=sortedAreas[0], high=sortedAreas[sortedAreas.length-1];
  let best=null,worst=null;
  if(prev){ const ds=AREAS.map(a=>[a,cur.scores[a.key]-prev.scores[a.key]]).sort((p,q)=>q[1]-p[1]); best=ds[0][1]>0?ds[0]:null; worst=ds[ds.length-1][1]<0?ds[ds.length-1]:null; }
  const rows=AREAS.map(a=>{const v=cur.scores[a.key], d=prev?v-prev.scores[a.key]:null;
    return `<div class="arow"><div class="top"><span>${a.icon} ${esc(a.name)}</span><span><b>${v}</b>/10${deltaHtml(d)}</span></div><div class="bar"><span style="width:${v*10}%;background:${a.color}"></span></div></div>`}).join("");
  return `
  <div class="stats">
    <div class="stat"><div class="v">${o}${deltaHtml(od)}</div><div class="l">คะแนนเฉลี่ยรวม (เต็ม 10)</div></div>
    <div class="stat"><div class="v">${b}%${deltaHtml(bd)}</div><div class="l">ความสมดุลของชีวิต</div></div>
    <div class="stat"><div class="v">${L.length}</div><div class="l">ครั้งที่เช็คอิน · ล่าสุด ${fmtDate(cur.date)}</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h2>วงล้อชีวิตของคุณ</h2><p class="sub">${prev?"เส้นประคือการเช็คอินครั้งก่อนหน้า":"เช็คอินอีกครั้งเพื่อเปรียบเทียบความเปลี่ยนแปลง"}</p>
      <div class="radar-box">${radar([...(prev?[{scores:prev.scores,stroke:"var(--muted)",dash:true}]:[]),{scores:cur.scores,stroke:"var(--accent)",fill:"color-mix(in srgb, var(--accent) 22%, transparent)"}])}</div>
      <div class="legend"><span><i style="background:var(--accent)"></i>ล่าสุด</span>${prev?`<span><i style="background:var(--muted)"></i>ครั้งก่อน (${fmtDate(prev.date)})</span>`:""}</div></div>
    <div class="card"><h2>รายด้าน</h2><p class="sub">เรียงตามหมวดชีวิต</p><div class="rows">${rows}</div>
      <div class="insight"><b>💬 ข้อสังเกต</b>
        ด้านที่ควรเติมพลังก่อน: <b style="display:inline">${low.icon} ${esc(low.name)}</b> (${cur.scores[low.key]}/10) · ด้านที่เป็นกำลังใจ: ${high.icon} ${esc(high.name)} (${cur.scores[high.key]}/10).
        ${best?`<br>เติบโตมากที่สุดรอบนี้: ${best[0].icon} ${esc(best[0].name)} (+${r1(best[1])})`:""}${worst?`<br>ลดลงมากที่สุด: ${worst[0].icon} ${esc(worst[0].name)} (${r1(worst[1])}) ลองใจดีกับตัวเองและดูว่าเกิดอะไรขึ้น`:""}
        <br><button class="btn-sm" style="margin-top:8px" data-focus="${low.key}">ตั้งเป้าหมายให้ ${esc(low.name)}</button></div></div>
  </div>`;
}

function viewCheck(){
  const L=sorted(), last=L[L.length-1];
  if(!ui.draft){ ui.draft={date:today(),scores:Object.fromEntries(AREAS.map(a=>[a.key,last?last.scores[a.key]:5])),note:""}; ui.mood=last?.mood||3; }
  const d=ui.draft;
  const sl=AREAS.map(a=>`<div class="slider-row"><div class="h"><div><span class="n">${a.icon} ${esc(a.name)}</span><div class="hint">${esc(a.hint)}</div></div><span class="val" id="v_${a.key}" style="color:${a.color}">${d.scores[a.key]}</span></div>
    <input type="range" min="1" max="10" step="1" value="${d.scores[a.key]}" data-slider="${a.key}" aria-label="${esc(a.name)}"></div>`).join("");
  return `<div class="card"><h2>เช็คอินวงล้อชีวิต</h2><p class="sub">ให้คะแนน 1–10 ตามความพึงพอใจ ณ ตอนนี้ (1 = ต้องการดูแลมาก, 10 = พอใจเต็มที่) ตอบตามความรู้สึกจริง ไม่มีถูกผิด</p>
    <label class="f" for="ci_date">วันที่</label><input type="date" id="ci_date" value="${d.date}" max="${today()}">
    ${sl}
    <label class="f">วันนี้ใจฉันรู้สึกอย่างไร</label>
    <div class="mood" role="group" aria-label="อารมณ์">${MOODS.map((m,i)=>`<button type="button" data-mood="${i+1}" aria-pressed="${ui.mood===i+1}">${m}</button>`).join("")}</div>
    <label class="f" for="ci_note">บันทึกสั้นๆ (ไม่บังคับ)</label><textarea id="ci_note" placeholder="เกิดอะไรขึ้นที่ทำให้ให้คะแนนแบบนี้?">${esc(d.note)}</textarea>
    <p style="margin:18px 0 0"><button class="btn-primary" id="saveCheck">บันทึกการเช็คอิน</button></p></div>`;
}

function viewProgress(){
  const L=sorted();
  if(L.length<2) return `<div class="card empty"><div class="big">📈</div><h2>กราฟความก้าวหน้า</h2><p>ต้องมีการเช็คอินอย่างน้อย 2 ครั้งจึงจะเห็นแนวโน้ม<br>แนะนำให้เช็คอินสัปดาห์ละครั้ง</p><button class="btn-primary" data-go="check">เช็คอินเลย</button></div>`;
  const first=L[0], last=L[L.length-1];
  const chips=AREAS.map(a=>`<button class="chip" data-chip="${a.key}" aria-pressed="${ui.sel.has(a.key)}"><i style="background:${a.color}"></i>${esc(a.name)}</button>`).join("");
  const cmp=AREAS.map(a=>[a,last.scores[a.key]-first.scores[a.key]]).sort((p,q)=>q[1]-p[1]).map(([a,d])=>
    `<div class="arow"><div class="top"><span>${a.icon} ${esc(a.name)}</span><span>${first.scores[a.key]} → <b>${last.scores[a.key]}</b>${deltaHtml(d)}</span></div></div>`).join("");
  const hist=[...L].reverse().map(c=>`<div class="hitem"><div><div class="d">${fmtDate(c.date,true)} ${MOODS[(c.mood||3)-1]} <span class="pill">เฉลี่ย ${overall(c)}</span><span class="pill">สมดุล ${balance(c)}%</span></div>${c.note?`<div class="m">${esc(c.note)}</div>`:""}</div><button class="btn-sm btn-ghost" data-delci="${c.id}" aria-label="ลบ">ลบ</button></div>`).join("");
  return `<div class="card chart"><h2>ความก้าวหน้าตามเวลา</h2><p class="sub">เส้นประหนา = คะแนนเฉลี่ยรวม · กดชื่อด้านเพื่อซ่อน/แสดง</p><div class="chips">${chips}</div>${lineChart(L)}</div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h2>เปรียบเทียบ ${fmtDate(first.date)} → ${fmtDate(last.date)}</h2><p class="sub">เรียงจากเติบโตมากไปน้อย</p><div class="rows">${cmp}</div></div>
    <div class="card"><h2>ประวัติเช็คอิน</h2><p class="sub">${L.length} ครั้ง</p><div class="hist">${hist}</div></div>
  </div>`;
}

function viewReflect(){
  const f=PROMPTS.map(([k,q])=>`<label class="f" for="r_${k}">${q}</label><textarea id="r_${k}"></textarea>`).join("");
  const opts=AREAS.map(a=>`<option value="${a.key}">${a.icon} ${esc(a.name)}</option>`).join("");
  const list=[...S.reflections].sort((a,b)=>b.date.localeCompare(a.date)).map(r=>{
    const body=PROMPTS.filter(([k])=>r.answers[k]).map(([k,q])=>`<div class="m"><b>${q}</b>\n${esc(r.answers[k])}</div>`).join("");
    return `<div class="hitem"><div><div class="d">${fmtDate(r.date,true)} ${r.mood?MOODS[r.mood-1]:""} ${r.focus&&area(r.focus)?`<span class="pill">โฟกัส: ${area(r.focus).icon} ${esc(area(r.focus).name)}</span>`:""}</div>${body}</div><button class="btn-sm btn-ghost" data-delref="${r.id}">ลบ</button></div>`}).join("");
  return `<div class="grid g2"><div class="card"><h2>บันทึกสะท้อนตัวเอง</h2><p class="sub">ใช้เวลา 5 นาที เขียนเท่าที่อยากเขียนได้ ข้อไหนไม่อยากตอบก็ข้ามได้</p>
    ${f}
    <div class="row2"><div><label class="f" for="r_focus">ด้านที่จะโฟกัส</label><select id="r_focus"><option value="">— ไม่ระบุ —</option>${opts}</select></div>
    <div><label class="f">อารมณ์</label><div class="mood" id="r_mood">${MOODS.map((m,i)=>`<button type="button" data-rmood="${i+1}" aria-pressed="false" style="font-size:1.2rem;padding:4px 9px">${m}</button>`).join("")}</div></div></div>
    <p style="margin:18px 0 0"><button class="btn-primary" id="saveRef">บันทึก</button></p></div>
    <div class="card"><h2>บันทึกที่ผ่านมา</h2><p class="sub">${S.reflections.length} รายการ</p><div class="hist">${list||'<div class="empty">ยังไม่มีบันทึก</div>'}</div></div></div>`;
}

function viewGoals(){
  const opts=AREAS.map(a=>`<option value="${a.key}"${ui.goalArea===a.key?" selected":""}>${a.icon} ${esc(a.name)}</option>`).join("");
  const done=S.goals.filter(g=>g.done).length;
  const groups=AREAS.map(a=>{const gs=S.goals.filter(g=>g.area===a.key); if(!gs.length) return "";
    return `<div class="card" style="margin-top:12px"><h2 style="color:${a.color}">${a.icon} ${esc(a.name)} <small style="color:var(--muted);font-weight:400">${gs.filter(g=>g.done).length}/${gs.length}</small></h2>
    ${gs.map(g=>`<div class="goal ${g.done?"done":""}"><input type="checkbox" data-goal="${g.id}" ${g.done?"checked":""} aria-label="เสร็จแล้ว"><span>${esc(g.text)}</span><button class="btn-sm btn-ghost" data-delgoal="${g.id}" aria-label="ลบ">✕</button></div>`).join("")}</div>`}).join("");
  return `<div class="card"><h2>เป้าหมายเล็กๆ รายด้าน</h2><p class="sub">${S.goals.length?`สำเร็จแล้ว ${done}/${S.goals.length} · `:""}ตั้งสิ่งที่ทำได้จริงในสัปดาห์นี้ เช่น “เดินเย็น 20 นาที 3 วัน”</p>
    <form class="addgoal" id="goalForm"><select id="g_area" aria-label="ด้าน">${opts}</select><input type="text" id="g_text" placeholder="เป้าหมายหรือนิสัยที่อยากสร้าง" maxlength="140" required><button class="btn-primary">เพิ่ม</button></form></div>
    ${groups||'<div class="card empty" style="margin-top:12px">ยังไม่มีเป้าหมาย</div>'}`;
}

/* ---------- render ---------- */
const TABS=[["home","ภาพรวม"],["check","เช็คอิน"],["progress","ความก้าวหน้า"],["reflect","บันทึกสะท้อน"],["goals","เป้าหมาย"]];
const VIEWS={home:viewHome,check:viewCheck,progress:viewProgress,reflect:viewReflect,goals:viewGoals};
function render(){
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${tab===k}">${l}</button>`).join("");
  $("#view").innerHTML=VIEWS[tab]();
}
function go(t){tab=t;render();window.scrollTo({top:0});}

/* ---------- events ---------- */
let rMood=0;
document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.tab) return go(t.dataset.tab);
  if(t.dataset.go) return go(t.dataset.go);
  if(t.id==="demoInline") return loadDemo();
  if(t.dataset.focus){ ui.goalArea=t.dataset.focus; return go("goals"); }
  if(t.dataset.mood){ ui.mood=+t.dataset.mood; document.querySelectorAll("[data-mood]").forEach(b=>b.setAttribute("aria-pressed",b===t)); return; }
  if(t.dataset.rmood){ rMood=+t.dataset.rmood; document.querySelectorAll("[data-rmood]").forEach(b=>b.setAttribute("aria-pressed",b===t)); return; }
  if(t.dataset.chip){ const k=t.dataset.chip; ui.sel.has(k)?ui.sel.delete(k):ui.sel.add(k); return render(); }
  if(t.dataset.delci){ if(confirm("ลบการเช็คอินนี้?")){S.checkins=S.checkins.filter(c=>c.id!==t.dataset.delci);save();render();} return; }
  if(t.dataset.delref){ if(confirm("ลบบันทึกนี้?")){S.reflections=S.reflections.filter(c=>c.id!==t.dataset.delref);save();render();} return; }
  if(t.dataset.delgoal){ S.goals=S.goals.filter(g=>g.id!==t.dataset.delgoal);save();return render(); }
  if(t.id==="saveCheck"){
    const d=ui.draft; d.date=$("#ci_date").value||today(); d.note=$("#ci_note").value.trim();
    S.checkins.push({id:uid(),date:d.date,scores:{...d.scores},mood:ui.mood,note:d.note});
    save(); ui.draft=null; toast("บันทึกแล้ว 🌿"); return go("home");
  }
  if(t.id==="saveRef"){
    const answers={}; PROMPTS.forEach(([k])=>{const v=$("#r_"+k).value.trim(); if(v) answers[k]=v;});
    if(!Object.keys(answers).length) return toast("เขียนอย่างน้อยหนึ่งข้อก่อนนะ");
    S.reflections.push({id:uid(),date:today(),answers,focus:$("#r_focus").value,mood:rMood||0});
    rMood=0; save(); toast("บันทึกการสะท้อนแล้ว 🙏"); return render();
  }
});
document.addEventListener("input",e=>{
  const s=e.target.dataset?.slider; if(s&&ui.draft){ ui.draft.scores[s]=+e.target.value; $("#v_"+s).textContent=e.target.value; }
});
document.addEventListener("change",e=>{
  if(e.target.dataset?.goal){ const g=S.goals.find(g=>g.id===e.target.dataset.goal); if(g){g.done=e.target.checked;save();render();} }
  if(e.target.id==="g_area") ui.goalArea=e.target.value;
});
document.addEventListener("submit",e=>{
  if(e.target.id==="goalForm"){ e.preventDefault(); const txt=$("#g_text").value.trim(); if(!txt) return;
    S.goals.push({id:uid(),area:$("#g_area").value,text:txt,done:false}); ui.goalArea=$("#g_area").value; save(); render(); $("#g_text").focus(); }
});

/* data dialog */
const dlg=$("#dlg");
$("#dataBtn").onclick=()=>dlg.showModal();
$("#closeDlg").onclick=()=>dlg.close();
$("#exportBtn").onclick=()=>{
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));
  a.download=`wheel-of-life-${today()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$("#importBtn").onclick=()=>$("#file").click();
$("#file").onchange=e=>{
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!Array.isArray(d.checkins)) throw 0;
      if(!confirm("นำเข้าจะแทนที่ข้อมูลปัจจุบัน ดำเนินการต่อ?")) return;
      S={checkins:d.checkins,reflections:d.reflections||[],goals:d.goals||[]}; save(); dlg.close(); render(); toast("นำเข้าสำเร็จ"); }
    catch(_){ toast("ไฟล์ไม่ถูกต้อง"); } e.target.value=""; };
  r.readAsText(f);
};
$("#demoBtn").onclick=()=>{ if(!S.checkins.length||confirm("แทนที่ข้อมูลเดิมด้วยข้อมูลตัวอย่าง?")){ dlg.close(); loadDemo(); } };
$("#clearBtn").onclick=()=>{ if(confirm("ลบข้อมูลทั้งหมดถาวร? (แนะนำให้ส่งออกสำรองก่อน)")){ S={checkins:[],reflections:[],goals:[]}; save(); ui.draft=null; dlg.close(); go("home"); toast("ลบข้อมูลแล้ว"); } };
$("#themeBtn").onclick=()=>{
  const r=document.documentElement, dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark"; try{localStorage.setItem(KEY+".theme",r.dataset.theme);}catch(_){}
};
try{const t=localStorage.getItem(KEY+".theme"); if(t) document.documentElement.dataset.theme=t;}catch(_){}

/* demo data */
function loadDemo(){
  const base={body:4,mind:5,career:6,money:4,family:7,social:5,growth:5,joy:3}, drift={body:.55,mind:.5,career:.25,money:.3,family:.1,social:.2,growth:.4,joy:.45};
  let seed=7; const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  const out=[]; const now=new Date();
  for(let i=0;i<10;i++){
    const d=new Date(now); d.setDate(d.getDate()-(9-i)*7); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
    const scores={}; AREAS.forEach(a=>{scores[a.key]=Math.max(1,Math.min(10,Math.round(base[a.key]+drift[a.key]*i+(rnd()-.5)*1.6)));});
    out.push({id:uid()+i,date:d.toISOString().slice(0,10),scores,mood:Math.min(5,Math.max(1,Math.round(2.5+i*.25+rnd()))),note:i===9?"เริ่มเดินเย็นทุกวัน นอนเป็นเวลามากขึ้น รู้สึกมีพลัง":i===0?"ช่วงนี้เหนื่อยและไม่ค่อยได้พักเลย":""});
  }
  S={checkins:out,reflections:[{id:uid(),date:today(),answers:{grat:"ขอบคุณที่ครอบครัวคอยสนับสนุน",win:"ออกกำลังกายครบ 4 วัน",next:"ใช้เวลากับงานอดิเรกให้มากขึ้น"},focus:"joy",mood:4}],
     goals:[{id:uid(),area:"joy",text:"วาดรูปสัปดาห์ละ 1 ครั้ง",done:false},{id:uid(),area:"body",text:"เดินเย็น 20 นาที 4 วัน/สัปดาห์",done:true},{id:uid(),area:"money",text:"ออมเงินอัตโนมัติ 10% ของรายได้",done:false}]};
  save(); ui.draft=null; go("home"); toast("โหลดข้อมูลตัวอย่างแล้ว");
}

render();

/* PWA: ออฟไลน์ + ติดตั้งเป็นแอพ */
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault(); installEvt=e;
  const b=document.createElement("button"); b.className="btn-sm btn-primary"; b.id="installBtn"; b.textContent="⬇ ติดตั้งแอพ";
  $(".tools").prepend(b);
  b.onclick=async()=>{ installEvt.prompt(); await installEvt.userChoice; installEvt=null; b.remove(); };
});
window.addEventListener("appinstalled",()=>{ $("#installBtn")?.remove(); toast("ติดตั้งแล้ว 🌿"); });
</script>
</body>
</html>
